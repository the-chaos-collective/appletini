query PRs {
  {{ range $_, $tracker := .Trackers }}
    {{ range $author_id, $author := $tracker.Authors }}
      {{ $tracker.Id }}_{{ $author_id }}: search(query: {{ quote (printf "repo:%s/%s is:open type:pr author:%s" $tracker.Owner $tracker.Repo $author) }}, type: ISSUE, first: {{$.PrAmount}}) {
        nodes {
          __typename
          ... on PullRequest {
            ...getPullRequest
          }
        }
      }
    {{ end }}
  {{ end }}
}

fragment getPullRequest on PullRequest {
  id
  number
  title
  url
  baseRefName
  headRefName 
  reviewRequests {
    totalCount
  }
  reviewDecision
  createdAt
  permalink
  mergeable
  state
  viewerLatestReview {
    state
  }
  commits(last: 1) {
    nodes {
      commit {
        statusCheckRollup {
          state
        }
      }
    }
  }
  ...getReviewer
}

fragment getReviewer on PullRequest {
  reviews(first: {{ .ReviewAmount }}) {
    totalCount
    edges {
      node {
        state
        body
        comments(first: {{ .CommentsAmount }}) {
          edges {
            node {
              body
            }
          }
        }
        author {
          login
        }
      }
    }
  }
}
