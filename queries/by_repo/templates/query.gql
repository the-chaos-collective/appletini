query PRs {
{{ range .Trackers }}
  {{ .Id }}: repository(name: {{ quote .Repo }}, owner: {{ quote .Owner }}) {
      pullRequests(
        orderBy: { field: CREATED_AT, direction: ASC }
        first: {{$.PrAmount}}
        states: [OPEN]
      ) {
        ...getPullRequest
      }
  }
  {{end}}
}

fragment getPullRequest on PullRequestConnection {
  edges {
    node {
      id
      number
      title
      url
      baseRefName
      headRefName 
      reviewRequests {
        totalCount
      }
      reviewDecision
      createdAt
      permalink
      mergeable
      state
      commits(last: 1) {
        nodes {
          commit {
            statusCheckRollup {
              state
            }
          }
        }
      }
      ...getReviewer
    }
  }
}

fragment getReviewer on PullRequest {
  reviews(first: {{ .ReviewAmount }}) {
    totalCount
    edges {
      node {
        state
        body
        comments(first: {{ .CommentsAmount }}) {
          edges {
            node {
              body
            }
          }
        }
        author {
          login
        }
      }
    }
  }
}
