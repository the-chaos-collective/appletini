linters:
  enable:
    - govet
    - gocritic
    - goimports
    - errcheck
    - unused
    - misspell
    - dupl
    - dupword
    - nestif
    - ineffassign
    - staticcheck
    - exhaustive
    - gofmt
    - gosec
    - exhaustruct
  disable:
    - funlen
    - gci

issues:
  exclude-rules:
    # Table tests deliberately set only the fields each case needs, and the
    # env var *names* used as fake token sources trip the credentials check.
    - path: _test\.go
      linters:
        - exhaustruct
    - path: _test\.go
      linters:
        - gosec
      text: "G101"

severity:
  default-severity: error
  rules:
    - linters:
        - godox
        - gofmt
      severity: warning

linters-settings:
  depguard:
    rules:
      prevent_unmaintained_packages:
        list-mode: lax # allow unless explicitely denied
        files:
          - $all
          - "!$test"
        allow:
          - $gostd
        deny:
          - pkg: io/ioutil
            desc: "replaced by io and os packages since Go 1.16: https://tip.golang.org/doc/go1.16#ioutil"
