name: Build and lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: write
  pull-requests: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Deps
        run: |
          go mod tidy
          go fmt ./...
          sudo apt install gcc gcc-multilib libgl1-mesa-dev xorg-dev -y

      - name: Build
        run: CGO_ENABLED=1 go build *.go

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        # The ci build tag makes Fyne headless, so no display or GL headers are needed.
        run: go test -tags ci -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Deps
        run: |
          go mod tidy
          go fmt ./...
          sudo apt install gcc gcc-multilib libgl1-mesa-dev xorg-dev -y

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          # .golangci.yml uses the v1 config format; "latest" now resolves to
          # golangci-lint v2, which rejects that format.
          version: v1.64.8
          args: --build-tags ci
