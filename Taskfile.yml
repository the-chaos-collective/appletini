version: "3"

tasks:
  default:
    cmds:
      - task -l
    silent: true    

  setup: # https://developer.fyne.io/started/
    desc: install necessary deps (ubuntu/debian)
    cmds:
      - sudo apt install golang gcc libgl1-mesa-dev xorg-dev -y

  test-env:
    desc: Test that system has necessary runtime deps installed
    cmds:
      - go run fyne.io/fyne/v2/cmd/fyne_demo@latest

  format:
    desc: format the project
    cmds:
      - go fmt ./...
    silent: true

  test:
    desc: run all tests (headless, no display or GL headers needed)
    cmds:
      - go test -tags ci ./...

  test:race:
    desc: run all tests with the race detector
    cmds:
      - go test -tags ci -race ./...

  test:cover:
    desc: run all tests and print coverage per package
    cmds:
      - go test -tags ci -cover ./...

  lint:
    desc: run golangci-lint (v1 config)
    cmds:
      - go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --build-tags ci ./...

  run:
    desc: runs app
    deps:
      - format
    cmds:
      - APPLETINI_LOG_LEVEL=debug go run .
    silent: true

  build:
    desc: build the this dope application
    deps:
      - format
    cmds:
      - mkdir -p dist/
      - task: clean
      - go build -o dist/main .
      - sudo chmod +x ./dist/main
      - cp config.json dist/
      - APPLETINI_LOG_LEVEL=debug ./dist/main

  run_built:
    desc: runs the build binary
    dir: dist
    cmds:
      - APPLETINI_LOG_LEVEL=debug ./main
    #silent: true

  clean:
    desc: remove dist files
    cmds:
      - rm -rf dist/*
    #internal: true
